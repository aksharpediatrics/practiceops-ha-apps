name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest practiceops_agent/tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./practiceops_agent"

  build:
    # The image Home Assistant builds on the Pi (arm64) and on a PC (amd64).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/arm64, linux/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform ${{ matrix.platform }} --load -t agent:test practiceops_agent
      - name: Starts, knows office hours, refuses to run without a token
        run: |
          docker run --rm --platform ${{ matrix.platform }} -w / agent:test \
            python -c "import agent; print(agent.VERSION, agent.in_office_hours())"
          mkdir -p data && echo '{"practiceops_token": ""}' > data/options.json
          if docker run --rm --platform ${{ matrix.platform }} -v "$PWD/data:/data" agent:test > out.txt; then
            echo "should have stopped without a token"; exit 1
          fi
          grep "No PracticeOps token" out.txt

  esphome:
    # The vaccine fridge and freezer monitor, built with this repo's sht1x component.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('esphome/*.yaml') }}
      - run: pip install esphome
      - name: Compile
        working-directory: esphome
        run: |
          sed -i 's|- source: github://.*|- source: { type: local, path: ../components }|' vaccine-temps.yaml
          cat > secrets.yaml <<'SECRETS'
          vaccine_temps_api_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          vaccine_temps_ota_password: "test"
          wifi_ssid: "home"
          wifi_password: "testtest"
          office_wifi_ssid: "office"
          office_wifi_password: "testtest"
          fallback_hotspot_password: "testtest"
          SECRETS
          esphome compile vaccine-temps.yaml
